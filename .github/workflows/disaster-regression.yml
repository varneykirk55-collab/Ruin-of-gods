name: Disaster regression
on:
  push:
    branches: [astra/water-disaster-survival, astra/volcanic-frontier, astra/arctic-frontier, astra/wider-lava-power]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify bundle
        run: |
          node build.js
          git diff --exit-code -- index.html
      - name: Frontier and authentic legacy save regression
        run: |
          git show f21ec4ecc68e9ed422d5b5cf5ebc08c663caa98c:src/sim.js > "$RUNNER_TEMP/legacy-valley.cjs"
          LEGACY_SIM="$RUNNER_TEMP/legacy-valley.cjs" node tests/frontier.js
      - name: Arctic thermal and v3 save regression
        run: |
          git show f5751a1107c580a913fda9828a67a606ca18d7aa:src/sim.js > "$RUNNER_TEMP/volcanic-valley.cjs"
          ARCTIC_BASE_SIM="$RUNNER_TEMP/volcanic-valley.cjs" node tests/arctic.js
      - name: Lava spread and duration regression
        run: |
          git show dee990a1983a85977d8054002fedd28ee9ae5c65:src/sim.js > "$RUNNER_TEMP/lava-before.cjs"
          LAVA_BASE_SIM="$RUNNER_TEMP/lava-before.cjs" node tests/lava.js
      - name: Existing simulation regression
        run: node tests/test_sim.js 1234
      - name: Water and survival regression
        run: node tests/disaster_survival.js
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build
        run: node build.js
      - name: Lava touch and desktop power
        run: node tests/lava_browser.js
      - name: Arctic portrait baseline, navigation and frozen interactions
        run: |
          git show f5751a1107c580a913fda9828a67a606ca18d7aa:index.html > baseline.html
          ARCTIC_BASE_HTML="$PWD/baseline.html" node tests/arctic_browser.js
      - name: Browser power combinations and persistence
        run: node tests/browser_powers.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-disaster-evidence
          path: artifacts/
