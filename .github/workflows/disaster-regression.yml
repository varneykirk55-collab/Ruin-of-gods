name: Disaster regression
on:
  push:
    branches: [astra/water-disaster-survival]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and verify bundle
        run: |
          node build.js
          git diff --exit-code -- index.html
      - name: Existing simulation regression
        run: node tests/test_sim.js 1234
      - name: Water and survival regression
        run: node tests/disaster_survival.js
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Build
        run: node build.js
      - name: Browser power combinations and persistence
        run: node tests/browser_powers.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-disaster-evidence
          path: artifacts/
